name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python quality, tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Prepare test runtime data
        run: |
          python deploy/prepare_runtime.py
          mkdir -p data
          ln -sf /tmp/gramartha-runtime/gramartha.sqlite data/sih26091_phase2.sqlite
          ln -sf /tmp/gramartha-runtime/west_bengal_osm_poi.sqlite data/west_bengal_osm.sqlite

      - name: Ruff
        run: ruff check backend scripts tests deploy

      - name: Python compilation
        run: python -m compileall -q backend scripts deploy

      - name: Pytest with branch coverage gate
        run: |
          pytest \
            --cov=backend \
            --cov-branch \
            --cov-fail-under=75 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("coverage.xml")
          if not path.exists():
              print("coverage.xml not produced")
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          line = float(root.attrib.get("line-rate", 0)) * 100
          branch = float(root.attrib.get("branch-rate", 0)) * 100
          print(f"Backend line coverage: {line:.1f}%")
          print(f"Backend branch coverage: {branch:.1f}%")
          summary = Path("coverage-summary.md")
          summary.write_text(
              "## GramArtha test coverage\n\n"
              f"- Backend line coverage: **{line:.1f}%**\n"
              f"- Backend branch coverage: **{branch:.1f}%**\n"
              "- Combined coverage gate: **>= 75%**\n",
              encoding="utf-8",
          )
          PY
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage-summary.md
            htmlcov/
          if-no-files-found: warn
          retention-days: 30

      - name: Version consistency
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          api = Path("backend/api/main.py").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          api_match = re.search(r'FastAPI\(.*?version="([^"]+)"', api, re.S)
          if not api_match:
              raise SystemExit("Could not find FastAPI version in backend/api/main.py")
          if api_match.group(1) != version:
              raise SystemExit(f"API version {api_match.group(1)} != package version {version}")
          if f"v{version}" not in readme:
              raise SystemExit(f"README does not advertise v{version}")

          print(f"Version consistency OK: {version}")
          PY

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check frontend/app.js

  docs-integrity:
    name: Docs & repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository hygiene and local Markdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          forbidden = [
              Path("FILES_TO_DELETE.md"),
              Path("design-qa.md"),
              Path("docs/ARCHITECTURE.md"),
          ]
          present = [str(path) for path in forbidden if path.exists()]
          if present:
              raise SystemExit("Repository hygiene regression: " + ", ".join(present))

          docs = [Path("README.md"), Path("ARCHITECTURE.md"), Path("docs/README.md")]
          pattern = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          missing = []
          for doc in docs:
              text = doc.read_text(encoding="utf-8")
              for raw in pattern.findall(text):
                  target = raw.strip().split()[0].strip("<>\"")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#", 1)[0].split("?", 1)[0]
                  if not target:
                      continue
                  resolved = (doc.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f"{doc}: {raw}")
          if missing:
              raise SystemExit("Broken local Markdown links:\n" + "\n".join(missing))
          print("Repository hygiene and local Markdown links: OK")
          PY

  runtime-smoke:
    name: Public runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Prepare public runtime
        run: python deploy/prepare_runtime.py

      - name: SQLite integrity
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          base = Path("/tmp/gramartha-runtime")
          for name in ("gramartha.sqlite", "west_bengal_osm_poi.sqlite"):
              path = base / name
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing runtime DB: {path}")
              with sqlite3.connect(path) as conn:
                  result = conn.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"SQLite integrity failed for {name}: {result}")
              print(f"{name}: integrity ok")
          PY

      - name: API health smoke
        env:
          SIH26091_SQLITE_PATH: /tmp/gramartha-runtime/gramartha.sqlite
          SIH26091_OSM_SQLITE_PATH: /tmp/gramartha-runtime/west_bengal_osm_poi.sqlite
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.api.main import app

          response = TestClient(app).get("/health")
          response.raise_for_status()
          payload = response.json()
          assert payload["status"] == "ok", payload
          print(payload)
          PY
