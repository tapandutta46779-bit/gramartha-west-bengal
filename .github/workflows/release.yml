name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build verified release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'

      - name: Verify
        run: |
          ruff check backend scripts tests deploy
          pytest
          python -m compileall -q backend scripts deploy

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || {
            echo "Tag $TAG does not match package version $VERSION"
            exit 1
          }

      - name: Build Python package
        run: python -m build

      - name: Build public runtime bundle
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          tar -czf "dist/gramartha-${VERSION}-public-runtime.tar.gz" \
            backend frontend deploy render.yaml pyproject.toml README.md \
            LICENSE DATA_LICENSES.md NOTICE.md SECURITY.md
          (
            cd dist
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gramartha-release
          path: |
            dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "GramArtha ${GITHUB_REF_NAME}"
