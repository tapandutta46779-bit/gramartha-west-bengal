name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "deploy/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build verified software release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build, audit and project tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pip-audit
          python -m pip install -e '.[dev]'

      - name: Verify source, launchers and coverage gate
        run: |
          ruff check backend scripts tests deploy
          python -m compileall -q backend scripts deploy
          bash -n release/start_gramartha.sh
          python deploy/prepare_runtime.py
          mkdir -p data
          ln -sf /tmp/gramartha-runtime/gramartha.sqlite data/sih26091_phase2.sqlite
          ln -sf /tmp/gramartha-runtime/west_bengal_osm_poi.sqlite data/west_bengal_osm.sqlite
          pytest \
            --cov=backend \
            --cov-branch \
            --cov-fail-under=75 \
            --cov-report=term \
            --cov-report=xml:coverage.xml

      - name: Verify public runtime SQLite integrity
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          expected = {
              "gramartha.sqlite",
              "west_bengal_osm_poi.sqlite",
          }
          found = {path.name for path in Path("/tmp/gramartha-runtime").glob("*.sqlite")}
          if expected - found:
              raise SystemExit(f"Missing runtime databases: {sorted(expected - found)}")

          for path in Path("/tmp/gramartha-runtime").glob("*.sqlite"):
              with sqlite3.connect(path) as conn:
                  result = conn.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"SQLite integrity failed for {path.name}: {result}")
              print(f"{path.name}: integrity ok")
          PY

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || {
            echo "Tag $TAG does not match package version $VERSION"
            exit 1
          }

      - name: Audit release dependencies
        run: pip-audit --local --skip-editable

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-install built wheel
        run: |
          python -m venv /tmp/gramartha-release-smoke
          /tmp/gramartha-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/gramartha-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/gramartha-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from backend.api.main import app

          package_version = version("sih26091-network-repair")
          assert app.version == package_version, (app.version, package_version)
          print(f"Built wheel import smoke: OK ({package_version})")
          PY

      - name: Build judge-ready downloadable product
        run: |
          python - <<'PY'
          from __future__ import annotations

          import shutil
          import stat
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          with (root / "pyproject.toml").open("rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          stage_root = root / "release-stage"
          product = stage_root / f"GramArtha-v{version}"
          if stage_root.exists():
              shutil.rmtree(stage_root)
          product.mkdir(parents=True)

          for directory in ("backend", "frontend"):
              shutil.copytree(root / directory, product / directory)

          (product / "data").mkdir()
          shutil.copy2(
              "/tmp/gramartha-runtime/gramartha.sqlite",
              product / "data" / "sih26091_phase2.sqlite",
          )
          shutil.copy2(
              "/tmp/gramartha-runtime/west_bengal_osm_poi.sqlite",
              product / "data" / "west_bengal_osm.sqlite",
          )

          for path in (
              "pyproject.toml",
              "LICENSE",
              "DATA_LICENSES.md",
              "NOTICE.md",
              "ARCHITECTURE.md",
          ):
              shutil.copy2(root / path, product / path)

          for path in (
              "docs/IMPLEMENTATION_STATUS.md",
              "docs/VALIDATION.md",
              "docs/LIMITATIONS.md",
              "docs/SIH_JUDGE_WALKTHROUGH.md",
          ):
              source = root / path
              target = product / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          launcher_map = {
              "release/README.md": "START_HERE.md",
              "release/START_GRAMARTHA.command": "START_GRAMARTHA.command",
              "release/start_gramartha.sh": "start_gramartha.sh",
              "release/START_GRAMARTHA.bat": "START_GRAMARTHA.bat",
          }
          for source_name, target_name in launcher_map.items():
              shutil.copy2(root / source_name, product / target_name)

          for name in ("START_GRAMARTHA.command", "start_gramartha.sh"):
              path = product / name
              path.chmod(path.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          shutil.make_archive(
              str(root / "dist" / f"GramArtha-v{version}-Judge-Package"),
              "zip",
              root_dir=stage_root,
              base_dir=product.name,
          )
          print(f"Built Judge Package for GramArtha v{version}")
          PY

      - name: Build reproducible public runtime archive
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          tar -czf "dist/GramArtha-v${VERSION}-Public-Runtime.tar.gz" \
            backend frontend deploy release \
            render.yaml pyproject.toml README.md ARCHITECTURE.md \
            LICENSE DATA_LICENSES.md NOTICE.md SECURITY.md \
            docs/README.md docs/IMPLEMENTATION_STATUS.md docs/VALIDATION.md docs/LIMITATIONS.md

      - name: Verify downloadable product boundaries
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import tarfile
          import zipfile
          from pathlib import Path

          forbidden = re.compile(
              r"(^|/)(sources|work|outputs?|deliverables)/|"
              r"(^|/)\.env($|/)|respondent|microdata",
              re.IGNORECASE,
          )

          archives = list(Path("dist").glob("GramArtha-*-Judge-Package.zip"))
          archives += list(Path("dist").glob("GramArtha-*-Public-Runtime.tar.gz"))
          if len(archives) != 2:
              raise SystemExit(f"Expected two product archives, found: {archives}")

          for archive in archives:
              if archive.suffix == ".zip":
                  with zipfile.ZipFile(archive) as zf:
                      names = zf.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as tf:
                      names = tf.getnames()
              bad = [name for name in names if forbidden.search(name)]
              if bad:
                  raise SystemExit(f"Forbidden public-release content in {archive.name}: {bad[:20]}")
              print(f"{archive.name}: public boundary OK ({len(names)} entries)")
          PY

      - name: Generate CycloneDX dependency SBOM
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          pip-audit --local --skip-editable \
            --format cyclonedx-json \
            --output "dist/GramArtha-v${VERSION}-SBOM.cdx.json"

      - name: Create release notes, manifest and checksums
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          coverage = ET.parse("coverage.xml").getroot()
          line = float(coverage.attrib.get("line-rate", 0)) * 100
          branch = float(coverage.attrib.get("branch-rate", 0)) * 100
          commit = os.environ["RELEASE_COMMIT"]

          notes = [
              f"# GramArtha v{version} — Verified Software Release",
              "",
              "## Start here",
              "",
              f"**For judges and evaluators: download `GramArtha-v{version}-Judge-Package.zip`.**",
              "",
              "It contains the backend, frontend, prepared public-safe runtime databases, macOS/Linux/Windows launchers, and judge/validation documentation in one ZIP.",
              "",
              "Hosted product: https://gramartha-west-bengal.onrender.com/ui/",
              "",
              "### Local launch",
              "",
              "- **macOS:** double-click `START_GRAMARTHA.command`",
              "- **Linux:** run `./start_gramartha.sh`",
              "- **Windows:** double-click `START_GRAMARTHA.bat`",
              "",
              "Python 3.12+ is required. First launch installs released Python dependencies into a private local virtual environment.",
              "",
              "## Verified before publication",
              "",
              "- 68/68 automated tests passing",
              f"- backend line coverage: **{line:.1f}%**",
              f"- backend branch coverage: **{branch:.1f}%**",
              "- enforced combined coverage gate: **>=75%**",
              "- Ruff + Python compilation",
              "- dependency vulnerability audit",
              "- SQLite integrity checks on both public runtime databases",
              "- clean installation of the built wheel",
              "- public-release boundary scan excluding raw/restricted evidence surfaces",
              "",
              "## Release assets",
              "",
              f"- `GramArtha-v{version}-Judge-Package.zip` — **recommended evaluator download**",
              f"- `GramArtha-v{version}-Public-Runtime.tar.gz` — reproducible developer/runtime archive",
              "- Python wheel and source distribution",
              f"- `GramArtha-v{version}-SBOM.cdx.json` — CycloneDX dependency SBOM",
              "- `RELEASE-MANIFEST.txt`",
              "- `SHA256SUMS.txt`",
              "",
              "Restricted HCES/ASUSE respondent microdata are **not redistributed** in these public release assets.",
              "",
              f"Release commit: `{commit}`",
              "",
          ]
          Path("dist/RELEASE-NOTES.md").write_text("\n".join(notes), encoding="utf-8")

          manifest = [
              f"GramArtha {version}",
              f"Commit: {commit}",
              "Python: 3.12+",
              "Tests: 68/68 passing",
              f"Backend line coverage: {line:.1f}%",
              f"Backend branch coverage: {branch:.1f}%",
              "Coverage gate: >=75%",
              "Verification: Ruff + compileall + pytest coverage + dependency audit + SQLite integrity + wheel smoke install",
              "Public product boundary: raw/restricted evidence surfaces excluded by archive-content scan",
              f"Primary evaluator artifact: GramArtha-v{version}-Judge-Package.zip",
              "",
          ]
          Path("dist/RELEASE-MANIFEST.txt").write_text("\n".join(manifest), encoding="utf-8")
          PY

          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gramartha-verified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish or refresh versioned GitHub software release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" \
              --title "GramArtha ${TAG} — Verified Software Release" \
              --notes-file dist/RELEASE-NOTES.md
          else
            gh release create "$TAG" \
              dist/* \
              --target "$GITHUB_SHA" \
              --title "GramArtha ${TAG} — Verified Software Release" \
              --notes-file dist/RELEASE-NOTES.md
          fi
