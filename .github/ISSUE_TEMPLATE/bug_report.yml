name: Bug report
description: Report reproducible incorrect or broken behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GramArtha. Do not include secrets, restricted survey records or vulnerability details here; use SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.7.2 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start...
        2. Submit...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Sanitized logs, response snippets, screenshots or analysis IDs. Remove secrets/private data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / service
        - Evidence / geography
        - Flow / optimization
        - Finance / digital twin
        - Uncertainty / robustness
        - Frontend
        - PDF / localization
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, restricted microdata and personal/private data from this report.
          required: true
