[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sih26091-network-repair"
version = "0.5.0"
description = "Evidence-backed West Bengal economic network repair and venture finance engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "osmium>=4,<5",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.7,<2",
  "shapely>=2,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
sih26091-ingest-livestock = "backend.evidence.livestock_adapter:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
