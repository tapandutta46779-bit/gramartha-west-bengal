<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">GramArtha decision engine overview</title>
  <desc id="desc">A clean four-stage flow from verified local evidence to economic network analysis, minimum viable venture search and stress-tested financial action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c18"/>
      <stop offset="1" stop-color="#123f32"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e0bd"/>
      <stop offset="0.72" stop-color="#66e0bd"/>
      <stop offset="1" stop-color="#f0a14a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#8debd1" stroke-width="1">
    <path d="M0 86H1200M0 172H1200M0 258H1200M0 344H1200"/>
    <path d="M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430M840 0V430M960 0V430M1080 0V430"/>
  </g>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="62" y="61" fill="#f7fbf8" font-size="37" font-weight="820">GramArtha</text>
    <text x="62" y="94" fill="#9adcc9" font-size="18">Evidence-backed hyper-local economic network repair</text>
    <rect x="1010" y="42" width="128" height="40" rx="20" fill="#173f35" stroke="#4fc6a5"/>
    <text x="1074" y="68" text-anchor="middle" fill="#b8f1df" font-size="15" font-weight="760">SIH26091</text>

    <path d="M154 206H1043" fill="none" stroke="url(#track)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>

    <g>
      <circle cx="160" cy="206" r="48" fill="#0b2b23" stroke="#66e0bd" stroke-width="3"/>
      <text x="160" y="216" text-anchor="middle" fill="#c8f7e9" font-size="25" font-weight="850">01</text>
      <text x="160" y="287" text-anchor="middle" fill="#78e6c7" font-size="14" font-weight="800">VERIFIED EVIDENCE</text>
      <text x="160" y="316" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="760">Local reality</text>
      <text x="160" y="343" text-anchor="middle" fill="#bdd4cc" font-size="14">identity · provenance · confidence</text>
    </g>

    <g>
      <circle cx="453" cy="206" r="48" fill="#0b2b23" stroke="#66e0bd" stroke-width="3"/>
      <text x="453" y="216" text-anchor="middle" fill="#c8f7e9" font-size="25" font-weight="850">02</text>
      <text x="453" y="287" text-anchor="middle" fill="#78e6c7" font-size="14" font-weight="800">ECONOMIC NETWORK</text>
      <text x="453" y="316" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="760">Flow + bottlenecks</text>
      <text x="453" y="343" text-anchor="middle" fill="#bdd4cc" font-size="14">supply · demand · residual gaps</text>
    </g>

    <g>
      <circle cx="746" cy="206" r="48" fill="#0b2b23" stroke="#66e0bd" stroke-width="3"/>
      <text x="746" y="216" text-anchor="middle" fill="#c8f7e9" font-size="25" font-weight="850">03</text>
      <text x="746" y="287" text-anchor="middle" fill="#78e6c7" font-size="14" font-weight="800">MINIMUM VIABLE VENTURE</text>
      <text x="746" y="316" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="760">Smallest safe repair</text>
      <text x="746" y="343" text-anchor="middle" fill="#bdd4cc" font-size="14">counterfactuals · robust choice</text>
    </g>

    <g>
      <circle cx="1040" cy="206" r="48" fill="#2d2519" stroke="#f0a14a" stroke-width="3"/>
      <text x="1040" y="216" text-anchor="middle" fill="#ffd5a0" font-size="25" font-weight="850">04</text>
      <text x="1040" y="287" text-anchor="middle" fill="#f2b66e" font-size="14" font-weight="800">FINANCIAL REALITY</text>
      <text x="1040" y="316" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="760">36-month stress test</text>
      <text x="1040" y="343" text-anchor="middle" fill="#d9c8b6" font-size="14">cash flow · failure · staging</text>
    </g>

    <rect x="62" y="376" width="1076" height="34" rx="17" fill="#0b2922" stroke="#315e50"/>
    <text x="82" y="399" fill="#9adcc9" font-size="14" font-weight="720">LANGUAGE AI: intake + explanation only</text>
    <text x="1118" y="399" text-anchor="end" fill="#f0b66f" font-size="14" font-weight="760">CORE DECISION: evidence + mathematics + auditable rules</text>
  </g>
</svg>
